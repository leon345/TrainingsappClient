image:
  repository: ghcr.io/leon345/trainingsapp-client
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicaCount: 1

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi

ingress:
  enabled: true
  className: traefik
  host: training.example.de
  annotations: {}
  tls:
    enabled: false
    secretName: ""
